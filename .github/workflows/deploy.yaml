name: deploy-chabokan
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: update-chabokan
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
          CHABOK_DEBUG: "true"
        # The chabok CLI prints its errors but always exits 0, so a failed
        # login or upload would otherwise show up here as a green check.
        # Check what it said instead of trusting the exit code.
        run: |
          npm install -g @chabokan.net/cli
          chabok login -t "$CHABOKAN_TOKEN" 2>&1 | tee login.log
          chabok deploy -s docker-yfgwhs 2>&1 | tee deploy.log
          if ! grep -q "Deployed to" deploy.log; then
            echo "::error::Chabokan did not confirm the deploy - see the CLI output above."
            exit 1
          fi
