version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: applylist
      POSTGRES_PASSWORD: applylist
      POSTGRES_DB: applylist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applylist -d applylist"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://applylist:applylist@db:5432/applylist
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ApplyList <no-reply@applylist.ir>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    # No `command:` — the image entrypoint already waits for Postgres and runs
    # `alembic upgrade head` before starting uvicorn.

volumes:
  pgdata:
