{% extends "base.html" %}
{% block title %}Edit {{ c.name }} · ApplyList{% endblock %}
{% block content %}
<section class="gradient-card rounded-2xl bg-white dark:bg-slate-900 shadow p-6 max-w-3xl mx-auto">
  <h2 class="text-lg font-semibold mb-5 grad-text">Edit contact</h2>
  {% if error %}<div class="mb-4 px-3 py-2 rounded-lg bg-rose-50 dark:bg-rose-950/50 text-rose-800 dark:text-rose-200 text-sm">{{ error }}</div>{% endif %}

  <form action="/edit/{{ c.id }}" method="post" class="grid md:grid-cols-2 gap-4">
    <label class="grid gap-1">
      <span class="text-xs text-slate-500 dark:text-slate-400">Name</span>
      <input name="name" value="{{ c.name }}" required class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-sky-400 focus:outline-none" />
    </label>
    <label class="grid gap-1">
      <span class="text-xs text-slate-500 dark:text-slate-400">University</span>
      <input name="university" value="{{ c.university }}" required class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-fuchsia-400 focus:outline-none" />
    </label>
    <label class="grid gap-1 md:col-span-2">
      <span class="text-xs text-slate-500 dark:text-slate-400">Research focus</span>
      <input name="research_focus" value="{{ c.research_focus }}" required class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-emerald-400 focus:outline-none" />
    </label>
    <label class="grid gap-1">
      <span class="text-xs text-slate-500 dark:text-slate-400">Email</span>
      <input type="email" name="contact_email" value="{{ c.contact_email }}" required class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-sky-400 focus:outline-none" />
    </label>
    <label class="grid gap-1">
      <span class="text-xs text-slate-500 dark:text-slate-400">Category</span>
      <input name="category" value="{{ c.category or 'General' }}" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-sky-400 focus:outline-none" />
    </label>
    <label class="grid gap-1 md:col-span-2">
      <span class="text-xs text-slate-500 dark:text-slate-400">Source URL</span>
      <input name="source_url" value="{{ c.source_url }}" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-fuchsia-400 focus:outline-none" />
    </label>
    <label class="grid gap-1 md:col-span-2">
      <span class="text-xs text-slate-500 dark:text-slate-400">Notes</span>
      <textarea name="notes" rows="4" placeholder="What you want to mention when you write to them…"
                class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-emerald-400 focus:outline-none">{{ c.notes or '' }}</textarea>
    </label>

    <div class="flex items-center gap-6 md:col-span-2 mt-1">
      <label class="inline-flex items-center gap-2">
        <input type="checkbox" name="email_sent" {% if c.email_sent %}checked{% endif %} class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" />
        <span class="text-sm">Email sent</span>
      </label>
      <label class="inline-flex items-center gap-2">
        <input type="checkbox" name="reminder_sent" {% if c.reminder_sent %}checked{% endif %} class="h-4 w-4 rounded border-slate-300 text-fuchsia-600 focus:ring-fuchsia-500" />
        <span class="text-sm">Reminder sent</span>
      </label>
      {% if c.email_sent_at %}
        <span class="text-xs text-slate-500 dark:text-slate-400">Last sent {{ c.email_sent_at | dt }}</span>
      {% endif %}
    </div>

    <div class="md:col-span-2 flex items-center gap-3 mt-2">
      <button class="px-4 py-2 rounded-xl bg-gradient-to-r from-sky-600 via-fuchsia-600 to-emerald-600 text-white font-medium shadow hover:opacity-95">Save changes</button>
      <a href="/professors" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
